jenkins:
  # Message système
  systemMessage: "Welcome to the Chocolatine-Powered Marvin Jenkins Instance."

  # Définitions des utilisateurs en local
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: chocolateen
          name: Hugo
          password: ${USER_CHOCOLATEEN_PASSWORD}
        - id: vaugie_g
          name: Garance
          password: ${USER_VAUGIE_G_PASSWORD}
        - id: i_dont_know
          name: Jeremy
          password: ${USER_I_DONT_KNOW_PASSWORD}
        - id: nasso
          name: Nassim
          password: ${USER_NASSO_PASSWORD}

  # Configuration des roles et autorisations globaux
  authorizationStrategy:
    roleBased:
      roles:
        global:
          # Role Administrateur
          - name: "admin"
            description: "Marvin master"
            permissions:
              - "Overall/Administer"
            entries:
              - user: "chocolateen"
          # Role APE
          - name: "ape"
            description: "Pedagogical team member"
            permissions:
              - "Overall/Read"
              - "Job/Build"
              - "Job/Workspace"
              - "Job/Read"
            entries:
              - user: "i_dont_know"
          # Role Gorilla
          - name: "gorilla"
            description: "Group Obsessively Researching Innovation Linked to Learning and Accomplishment"
            permissions:
              - "Overall/Read"
              - "Job/Build"
              - "Job/Workspace"
              - "Job/Configure"
              - "Job/Delete"
              - "Job/Move"
              - "Job/Create"
            entries:
              - user: "vaugie_g"
          # Role Assistant
          - name: "assist"
            description: "Assistant"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "Job/Workspace"
            entries:
              - user: "nasso"

jobs:
  - file: /var/jenkins_home/casc_configs/job_dsl.groovy