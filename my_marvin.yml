# Configuration pour jenkins

jenkins:
  systemMessage: "Welcome to the ChocolatinePowered Marvin Jenkins Instance"
  #globalNodeProperties:
    #- envVars:
        #env:
          #- key: VARIABLE1
            #value: foo
          #- key: VARIABLE2
            #value: bar

  # On définit les user en local
  securityRealm:
    local:
      # On désactive l'inscription
      allowsSignup: false
      users:
        - id: chocolateen
          name: Hugo
          password: ${USER_CHOCOLATEEN_PASSWORD}
        - id: vaugie_g
          name: Garance
          password: ${USER_VAUGIE_G_PASSWORD}
        - id: i_dont_know
          name: Jeremy
          password: ${USER_I_DONT_KNOW_PASSWORD}
        - id: nasso
          name: Nassim
          password: ${USER_NASSO_PASSWORD}

  # Authorization strategy en roleBased
  authorizationStrategy:
    roleBased:
      # Définition des roles globaux
      roles:
        global:
          # Role Admin
          - name: "admin"
            description: "Marvin master"
            permissions:
              - "Overall/Administer"
            entries:
              - user: "chocolateen" # ou Hugo
          # Role Ape
          - name: "ape"
            description: "Pedagogical team member"
            permissions:
              - "Workspaces/Read"
              - "Job/Build"
            entries:
              - user: "i_dont_know" # ou Jeremy
          # Role Gorilla
          - name: "gorilla"
            description: "Group Obsessively Researching Innovation Linked to Learning and Accomplishment"
            permissions:
              - "Workspaces/Read"
              - "Job/Configure"
              - "Job/Build"
              - "Job/Delete"
              - "Job/Move"
              - "Job/Create"
            entries:
              - user: "vaugie_g" # ou Garance
          # Role Assistant
          - name: "assist"
            description: "Assistant"
            permissions:
              - "Workspaces/Read"
              - "Job/Read"
            entries:
              - user: "nasso" # ou Nassim

        # Définir les items dont le Tools
        items:
          - name: "Tools"
            description: "Folder for miscellaneous tools."
            pattern: "./"
            #permissions:
              #- "Job/Configure"
              #- "Job/Build"
              #- "Job/Delete"
            #entries:
              #- user: "user1"
              #- user: "user2"

        #agents:
          #- name: "Agent1"
            #description: "Agent 1"
            #pattern: "agent1"
            #permissions:
              #- "Agent/Build"
            #entries:
              #- user: "user1"

  # Documentation Template a partir d'ici
  nodes:
    - permanent:
        name: "static-agent"
        remoteFS: "/home/jenkins"
        launcher:
          inbound:
            workDirSettings:
              disabled: true
              failIfWorkDirIsMissing: false
              internalDir: "remoting"
              workDirPath: "/tmp"

  slaveAgentPort: 50000

tool:
  git:
    installations:
      - name: git
        home: /usr/local/bin/git

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: SYSTEM
              id: ssh_with_passphrase_provided
              username: ssh_root
              passphrase: ${SSH_KEY_PASSWORD}
              description: "SSH passphrase with private key file. Private key provided"
              privateKeySource:
                directEntry:
                  privateKey: ${SSH_PRIVATE_KEY}