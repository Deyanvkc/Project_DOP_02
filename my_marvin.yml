jenkins:
  # Message système
  systemMessage: "Welcome to the ChocolatinePowered Marvin Jenkins Instance."

  # Définitions des utilisateurs en local
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: chocolateen
          name: Hugo
          password: ${USER_CHOCOLATEEN_PASSWORD}
        - id: vaugie_g
          name: Garance
          password: ${USER_VAUGIE_G_PASSWORD}
        - id: i_dont_know
          name: Jeremy
          password: ${USER_I_DONT_KNOW_PASSWORD}
        - id: nasso
          name: Nassim
          password: ${USER_NASSO_PASSWORD}

  # Configuration des roles et autorisations globaux
  authorizationStrategy:
    roleBased:
      roles:
        global:
          # Role Administrateur
          - name: "admin"
            description: "Marvin master"
            permissions:
              - "Overall/Administer"
            entries:
              - user: "chocolateen"
          # Role APE
          - name: "ape"
            description: "Pedagogical team member"
            permissions:
              - "Job/Build"
              - "Job/Workspace"
            entries:
              - user: "i_dont_know"
          # Role Gorilla
          - name: "gorilla"
            description: "Group Obsessively Researching Innovation Linked to Learning and Accomplishment"
            permissions:
              - "Job/Build"
              - "Job/Workspace"
              - "Job/Configure"
              - "Job/Delete"
              - "Job/Move"
              - "Job/Create"
            entries:
              - user: "vaugie_g"
          # Role Assistant
          - name: "assist"
            description: "Assistant"
            permissions:
              - "Job/Read"
              - "Job/Workspace"
            entries:
              - user: "nasso"

# Configuration de l'outil Git
tool:
  git:
    installations:
      - name: git
        home: /usr/local/bin/git

